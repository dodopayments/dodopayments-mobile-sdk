// Android side of the dodopayments_checkout Flutter plugin.
//
// This module contains NO checkout logic — it bridges the Pigeon channel to
// the native Android core, com.dodopayments.api:checkout-android.
group = "com.dodopayments.checkout_flutter"
version = "1.0.3"

buildscript {
    // Kotlin and compileSdk match mobile-sdk/kotlin (2.1.20 / 35). AGP here is
    // 8.12.0 rather than the core's 8.13.0 — this buildscript only applies when
    // the module is built standalone; inside a Flutter app the app's own AGP
    // wins, so the lower floor is deliberate.
    ext.kotlin_version = "2.1.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // LOCAL DEV: `./gradlew publishToMavenLocal` in mobile-sdk/kotlin so
        // com.dodopayments.api:checkout-android resolves without Maven Central.
        // Harmless for published consumers (empty unless the artifact is local).
        mavenLocal()
        // Alternatively, composite-build from the *consuming app's*
        // settings.gradle: includeBuild("<path-to>/mobile-sdk/kotlin")
        // (Gradle substitutes com.dodopayments.api:checkout-android automatically.)
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.dodopayments.checkout_flutter"
    // 35 matches the Kotlin core and keeps the AGP 8.9.1+ requirement off
    // consumers. Apps that need a higher compileSdk — e.g. another plugin pulls
    // an AndroidX build requiring 36 — can raise it without forking this plugin
    // by setting dodoCompileSdk in the app's gradle.properties or root ext.
    compileSdk = (rootProject.findProperty("dodoCompileSdk") ?: 35) as Integer

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }
}

dependencies {
    // The real SDK. All checkout logic (Custom Tab launch, return
    // interception, result parsing, abandoned-session store) lives here.
    implementation("com.dodopayments.api:checkout-android:1.0.2")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
}
