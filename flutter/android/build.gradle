// Android side of the dodopayments_checkout Flutter plugin.
//
// This module contains NO checkout logic — it bridges the Pigeon channel to
// the native Android core, com.dodopayments.api:checkout-android.
group = "com.dodopayments.checkout_flutter"
version = "1.0.2"

buildscript {
    // Aligned with mobile-sdk/kotlin (AGP 8.12.0 / Kotlin 2.1.20 / compileSdk 35).
    ext.kotlin_version = "2.1.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // LOCAL DEV: `./gradlew publishToMavenLocal` in mobile-sdk/kotlin so
        // com.dodopayments.api:checkout-android resolves without Maven Central.
        // Harmless for published consumers (empty unless the artifact is local).
        mavenLocal()
        // Alternatively, composite-build from the *consuming app's*
        // settings.gradle: includeBuild("<path-to>/mobile-sdk/kotlin")
        // (Gradle substitutes com.dodopayments.api:checkout-android automatically.)
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.dodopayments.checkout_flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }
}

dependencies {
    // The real SDK. All checkout logic (Custom Tab launch, return
    // interception, result parsing, abandoned-session store) lives here.
    implementation("com.dodopayments.api:checkout-android:1.0.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
}
