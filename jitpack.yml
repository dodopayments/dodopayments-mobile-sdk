# JitPack builds the Android core (kotlin/) from source and serves it from https://jitpack.io.
# JitPack sets GROUP, ARTIFACT and VERSION (the git tag, e.g. kotlin-v1.1.2); the build publishes under them.
jdk:
  - openjdk17
install:
  - cd kotlin && ./gradlew publishToMavenLocal -PjitpackGroup="${GROUP}.${ARTIFACT}" -PjitpackVersion="${VERSION}" --no-daemon --no-configuration-cache --stacktrace
