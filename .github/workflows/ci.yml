name: CI

# Unit tests on every PR (no network, no secrets). The E2E smoke that mints a
# real test-mode session runs in a separate nightly workflow so no secret key
# is ever exposed to PRs from forks.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    name: iOS core (swift test)
    runs-on: macos-26
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Type-check for iOS Simulator
        run: xcodebuild -scheme DodoCheckout -destination 'generic/platform=iOS Simulator' build

  react-native:
    name: React Native (typecheck + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: Android core (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew test

  flutter:
    name: Flutter (flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter test
