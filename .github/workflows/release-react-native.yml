name: Release React Native

# Triggered by pushing a tag like react-native-v1.0.0. Vendors the Swift core
# (CocoaPods needs it as source, see scripts/sync-ios-core.sh), verifies, then
# publishes to npm.
on:
  push:
    tags:
      - "react-native-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      # submodules: swift/ is a submodule on dodopayments-mobile-sdk-ios, and
      # scripts/sync-ios-core.sh vendors the iOS core out of it. A plain
      # checkout leaves swift/ empty and the vendoring step fails.
      # While that repo is internal, GITHUB_TOKEN cannot read it: set
      # SWIFT_SUBMODULE_TOKEN to a PAT with read access to this repo *and* the
      # iOS repo. Once the iOS repo is public, the fallback is enough.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SWIFT_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag matches the version being published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "react-native-v${VERSION}" ]; then
            echo "Tag $TAG does not match package.json version $VERSION." >&2
            echo "npm publishes the version in package.json, not the one in the tag. Aborting." >&2
            exit 1
          fi

      - run: npm ci

      - name: Vendor the Swift core for the iOS pod
        run: ./scripts/sync-ios-core.sh

      # npm ci already ran this via the prepare script; run it explicitly so a
      # build failure is attributed here rather than buried in install output.
      - name: Build lib/ (the commonjs, module, and typescript entry points)
        run: npm run build

      - run: npm run typecheck
      - run: npm test

      - name: Verify the published tarball contains the build output and the vendored core
        run: |
          PACK="$(npm pack --dry-run 2>&1)"
          for REQUIRED in \
            "ios/DodoCore/DodoCheckout.swift" \
            "lib/commonjs/index.js" \
            "lib/module/index.js" \
            "lib/typescript/index.d.ts"
          do
            echo "$PACK" | grep -q "$REQUIRED" || {
              echo "$REQUIRED is missing from the pack. Aborting before publish." >&2
              exit 1
            }
          done

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
