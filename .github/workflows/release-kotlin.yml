name: Release Kotlin

# Triggered by pushing a tag like kotlin-v1.0.0. Publishes to Maven Central via
# the vanniktech plugin configured in kotlin/build.gradle.kts.
on:
  push:
    tags:
      - "kotlin-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify the tag matches the version being published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from kotlin/build.gradle.kts." >&2
            exit 1
          fi
          if [ "$TAG" != "kotlin-v${VERSION}" ]; then
            echo "Tag $TAG does not match build.gradle.kts version $VERSION." >&2
            echo "Gradle publishes the version in build.gradle.kts, not the one in the tag. Aborting." >&2
            exit 1
          fi

      - run: ./gradlew test

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
