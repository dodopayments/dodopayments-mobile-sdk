name: Bump dependents

# After a Kotlin or Swift core release, React Native and Flutter both pin a
# specific version of that core (a Maven coordinate for Kotlin, a vendored
# source copy via scripts/sync-ios-core.sh for Swift). Neither picks up the
# new release automatically, so this opens a review-gated PR that does the
# bump — it never auto-merges, since a cross-package dependency bump deserves
# a human glance and a green CI run first.
on:
  workflow_run:
    workflows: ["Release Kotlin", "Release Swift"]
    types: [completed]

# peter-evans/create-pull-request needs both, regardless of the repo's default
# workflow-permission setting.
permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the Kotlin core version pin in RN and Flutter
        if: github.event.workflow_run.name == 'Release Kotlin'
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#kotlin-v}"
          sed -i "s/com.dodopayments:checkout-android:[0-9.]*/com.dodopayments:checkout-android:${VERSION}/" \
            react-native/android/build.gradle flutter/android/build.gradle
          echo "BUMP_SUMMARY=Bump com.dodopayments:checkout-android to ${VERSION} in react-native and flutter" >> "$GITHUB_ENV"

      - name: Re-vendor the Swift core in RN and Flutter
        if: github.event.workflow_run.name == 'Release Swift'
        run: |
          react-native/scripts/sync-ios-core.sh
          flutter/scripts/sync-ios-core.sh
          echo "BUMP_SUMMARY=Re-vendor the Swift core (${{ github.event.workflow_run.head_branch }}) into react-native and flutter" >> "$GITHUB_ENV"

      - name: Open a PR with the bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/bump-dependents-${{ github.event.workflow_run.head_branch }}
          title: "${{ env.BUMP_SUMMARY }}"
          commit-message: "${{ env.BUMP_SUMMARY }}"
          body: |
            Automated follow-up to the `${{ github.event.workflow_run.head_branch }}` release
            (${{ github.event.workflow_run.html_url }}).

            Review the diff and let CI go green before merging — this does not auto-merge.
