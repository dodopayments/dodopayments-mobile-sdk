name: Bump dependents

# After a Kotlin core release, React Native and Flutter both pin a specific
# version of it as a Maven coordinate. Neither picks up the new release
# automatically, so this opens a review-gated PR that bumps the pin — it
# never auto-merges, since a cross-package dependency bump deserves a human
# glance and a green CI run first.
#
# (Swift releases don't need this: RN/Flutter re-vendor the Swift core fresh
# from swift/ in their own release workflows, not from a pinned/committed
# copy, so there's nothing to bump here for a Swift release.)
on:
  workflow_run:
    workflows: ["Release Kotlin"]
    types: [completed]

# peter-evans/create-pull-request needs both, regardless of the repo's default
# workflow-permission setting.
permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the Kotlin core version pin in RN and Flutter
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#kotlin-v}"
          # The two build.gradle files are the pins that actually affect a
          # build; the two READMEs are install snippets for the same
          # coordinate. They're swept together so the docs can't drift a
          # release behind the pins (which is what happened after 1.0.2).
          # The versionless coordinate in README.md's package table has no
          # trailing ":version", so this pattern leaves it alone.
          sed -i "s/com\.dodopayments\.api:checkout-android:[0-9.]*/com.dodopayments.api:checkout-android:${VERSION}/" \
            react-native/android/build.gradle flutter/android/build.gradle \
            README.md kotlin/README.md
          echo "BUMP_SUMMARY=Bump com.dodopayments.api:checkout-android to ${VERSION} in react-native and flutter" >> "$GITHUB_ENV"

      - name: Open a PR with the bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PAT, not secrets.GITHUB_TOKEN — PRs opened with GITHUB_TOKEN
          # don't trigger other workflows (GitHub's anti-recursion behavior),
          # so ci.yml would never run on this PR otherwise.
          token: ${{ secrets.BUMP_DEPENDENTS_TOKEN }}
          branch: bot/bump-dependents-${{ github.event.workflow_run.head_branch }}
          title: "${{ env.BUMP_SUMMARY }}"
          commit-message: "${{ env.BUMP_SUMMARY }}"
          body: |
            Automated follow-up to the `${{ github.event.workflow_run.head_branch }}` release
            (${{ github.event.workflow_run.html_url }}).

            Review the diff and let CI go green before merging — this does not auto-merge.
