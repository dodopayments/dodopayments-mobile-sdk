name: Release Flutter

# Triggered by pushing a tag like flutter-v1.0.0. Vendors the Swift core
# (see scripts/sync-ios-core.sh), verifies, then publishes to pub.dev via
# GitHub Actions OIDC — no long-lived token needed. Two one-time prerequisites,
# both covered in RELEASING.md: the package must already exist on pub.dev (pub
# cannot create a new package from CI), and automated publishing must be
# configured in its Admin tab with tag pattern flutter-v{{version}}.
on:
  push:
    tags:
      - "flutter-v*"

# Required by pub.dev's OIDC-based automated publishing.
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      # submodules: see the note in release-react-native.yml. scripts/sync-ios-core.sh
      # vendors the iOS core out of the swift/ submodule, so a plain checkout
      # leaves it empty and the vendoring step fails.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SWIFT_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      # Required, despite looking redundant next to flutter-action below: this
      # is the only step that turns the OIDC token into a pub credential (it
      # runs `dart pub token add https://pub.dev --env-var PUB_TOKEN`), and
      # flutter-action does no token handling at all. Its `dart` is then
      # shadowed by Flutter's, which is fine — the credential lives in pub's
      # config, not the SDK. Delete this and every release fails unauthenticated.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      # Flutter carries the version in three places that have to agree, and
      # pub.dev publishes whatever pubspec.yaml says regardless of the tag.
      - name: Verify the tag matches the version in all three places
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PUBSPEC="$(sed -n 's/^version: *\(.*\)$/\1/p' pubspec.yaml)"
          GRADLE="$(sed -n 's/^version = "\(.*\)"$/\1/p' android/build.gradle)"
          PODSPEC="$(sed -n "s/^ *s\.version *= *'\(.*\)'$/\1/p" ios/dodopayments_checkout.podspec)"
          echo "pubspec.yaml=$PUBSPEC android/build.gradle=$GRADLE podspec=$PODSPEC tag=$TAG"
          if [ "$TAG" != "flutter-v${PUBSPEC}" ]; then
            echo "Tag $TAG does not match pubspec.yaml version $PUBSPEC. Aborting." >&2
            exit 1
          fi
          if [ "$GRADLE" != "$PUBSPEC" ] || [ "$PODSPEC" != "$PUBSPEC" ]; then
            echo "Version drift: pubspec.yaml, android/build.gradle, and the podspec must all match." >&2
            exit 1
          fi

      - name: Vendor the Swift core for the iOS pod
        run: ./scripts/sync-ios-core.sh

      - run: flutter pub get
      - run: flutter test

      # `dart pub publish --dry-run` renders the package as a tree, so no line
      # ever contains a joined path like "DodoCheckoutCore/DodoCheckout.swift".
      # Match on basenames instead, and keep the dry run's own exit code rather
      # than piping it into grep, so a genuinely failing dry run can't pass.
      - name: Verify the package actually includes the vendored core
        run: |
          if ! OUT="$(dart pub publish --dry-run 2>&1)"; then
            printf '%s\n' "$OUT" >&2
            echo "dart pub publish --dry-run failed — aborting before publish." >&2
            exit 1
          fi
          printf '%s\n' "$OUT"

          if ! printf '%s\n' "$OUT" | grep -qF 'DodoCheckoutCore'; then
            echo "ios/DodoCheckoutCore is missing from the package — aborting before publish." >&2
            exit 1
          fi

          # Check against the submodule source, not ios/DodoCheckoutCore: looping
          # over the vendored copy would only ever compare it to itself, so a
          # file the sync missed is silently never looked for.
          shopt -s nullglob
          src=(../swift/Sources/DodoCheckout/*.swift)
          shopt -u nullglob
          if [ "${#src[@]}" -eq 0 ]; then
            echo "no Swift sources under ../swift — is the submodule checked out?" >&2
            exit 1
          fi

          rc=0
          for f in "${src[@]}"; do
            base="$(basename "$f")"
            if ! printf '%s\n' "$OUT" | grep -qF "$base"; then
              echo "core file missing from the package: $base" >&2
              rc=1
            fi
          done
          exit "$rc"

      - run: dart pub publish --force
